<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찰칵 Chalcock</title>
<style>
  :root {
    --bg: #0a0b10;
    --panel: #151922;
    --panel-2: #1b202b;
    --line: #262c3a;
    --line-soft: #1e232e;
    --text: #eceef4;
    --muted: #8991a6;
    --muted-2: #626a80;
    --accent: #f0a04b;
    --accent-2: #f7c68b;
    --accent-dim: #8a5d29;
    --accent-wash: rgba(240,160,75,.09);
    --violet: #7c6bf0;
    --green: #34d17c;
    --red: #ef8a8a;
    --radius: 16px;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 90px; position: relative; z-index: 1; }
  a { color: inherit; text-decoration: none; }

  /* ---- decorative backdrop: fixed, behind everything, never intercepts clicks ---- */
  .backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .backdrop .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .28; }
  .backdrop .glow.amber { width: 620px; height: 620px; background: #f0a04b; top: -220px; left: -120px;
                           animation: drift1 22s ease-in-out infinite alternate; }
  .backdrop .glow.violet { width: 520px; height: 520px; background: #6a5bd8; top: 30%; right: -180px;
                            opacity: .22; animation: drift2 26s ease-in-out infinite alternate; }
  .backdrop .glow.teal { width: 460px; height: 460px; background: #2bb8a3; bottom: -220px; left: 18%;
                          opacity: .16; animation: drift1 30s ease-in-out infinite alternate-reverse; }
  .backdrop .grain {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 26px 26px; opacity: .5;
  }
  .backdrop .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(900px 600px at 50% 0%, transparent 0%, var(--bg) 92%);
  }
  @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(40px,50px); } }
  @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-50px,30px); } }

  /* top bar */
  .topbar {
    position: sticky; top: 0; z-index: 40; backdrop-filter: blur(10px);
    background: rgba(10,11,16,.7); border-bottom: 1px solid var(--line-soft);
  }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex;
    align-items: center; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 16px;
           letter-spacing: -.2px; }
  .brand .glass { font-size: 19px; }
  .brand b { color: var(--accent); font-weight: 800; }
  .brand small { color: var(--muted); font-weight: 500; margin-left: 2px; }

  /* ---- hero (home / upload page) ---- */
  .hero { padding: 64px 0 8px; text-align: center; position: relative; }
  .hero-glass {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 260px; height: 260px; opacity: .1; z-index: -1;
  }
  .hero-mark { font-size: 42px; margin-bottom: 6px; }
  h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -0.6px; }
  h1 b { color: var(--accent); font-weight: 800; }
  .sub { color: var(--muted); margin: 0 auto; font-size: 15px; max-width: 480px; }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow);
  }
  .panel + .panel { margin-top: 22px; }
  .panel h2 { margin: 0 0 16px; font-size: 13px; text-transform: uppercase;
              letter-spacing: 1.2px; color: var(--muted); font-weight: 700; }

  .upload-panel { max-width: 620px; margin: 36px auto 0; }

  #drop {
    border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 52px 20px;
    text-align: center; cursor: pointer; transition: border-color .18s, background .18s, transform .12s;
  }
  #drop:hover { border-color: var(--accent-dim); background: var(--accent-wash); }
  #drop.over { border-color: var(--accent); background: var(--accent-wash); transform: scale(.995); }
  #drop .icon { font-size: 34px; margin-bottom: 10px; opacity: .9; }
  #drop strong { font-size: 17px; display: block; }
  #drop p { margin: 7px 0 0; color: var(--muted); font-size: 13.5px; }

  .samples-label { font-size: 12px; color: var(--muted-2); margin: 20px 0 8px; text-align: center; }
  .samples { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .samples img {
    width: 58px; height: 58px; object-fit: cover; border-radius: 9px; cursor: pointer;
    border: 2px solid transparent; transition: border-color .15s, transform .15s; opacity: .92;
  }
  .samples img:hover { border-color: var(--accent); transform: translateY(-2px); opacity: 1; }

  .spin { display: none; color: var(--accent); font-size: 13.5px; margin-top: 18px;
          align-items: center; justify-content: center; gap: 8px; }
  .spin.on { display: flex; }
  .spin .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
               animation: pulse 1s infinite ease-in-out; }
  .spin .dot:nth-child(2) { animation-delay: .15s; }
  .spin .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---- results page ---- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  #shot { width: 100%; border-radius: 10px; display: block; }
  .stats { display: flex; gap: 22px; margin-top: 16px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 23px; color: var(--accent); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

  .rows { display: flex; flex-direction: column; gap: 9px; }
  .row-card {
    display: flex; gap: 13px; align-items: center; width: 100%; text-align: left;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
    background: var(--panel-2); color: inherit; font: inherit; cursor: pointer;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .row-card:hover { border-color: var(--accent-dim); background: #212734; transform: translateY(-1px); }
  .row-card .thumb {
    width: 48px; height: 48px; border-radius: 9px; object-fit: cover; flex: 0 0 auto;
    background: var(--panel); border: 1px solid var(--line-soft);
  }
  .row-card .thumb.ph {
    display: grid; place-items: center; color: var(--accent-dim); font-size: 20px;
  }
  .row-card .body { flex: 1 1 auto; min-width: 0; }
  .row-card .nm { font-size: 14.5px; font-weight: 600; }
  .row-card .ing { font-size: 12px; color: var(--muted); overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
  .row-card .go { color: var(--muted-2); font-size: 17px; flex: 0 0 auto; }
  .row-card .conf { color: var(--green); font-variant-numeric: tabular-nums; font-size: 12.5px; flex: 0 0 auto; }
  .cat { font-size: 11px; color: var(--accent-dim); text-transform: uppercase; letter-spacing: .6px; }
  .miss { font-size: 12px; color: var(--red); }
  .sub-note { font-size: 12px; color: var(--accent-dim); }

  .empty { color: var(--muted); font-size: 14px; padding: 10px 0; }

  /* ---- detail pages (bottle / cocktail) ---- */
  .view { animation: rise .22s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .back {
    display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px;
    margin: 22px 0 18px; cursor: pointer; transition: color .15s;
  }
  .back:hover { color: var(--text); }

  .detail-sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    overflow: hidden; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 320px 1fr; align-items: start;
  }
  @media (max-width: 720px) { .detail-sheet { grid-template-columns: 1fr; } }

  .detail-media {
    background: linear-gradient(160deg, #1c212c, #12151d);
    display: grid; place-items: center; min-height: 300px; padding: 22px;
    position: sticky; top: 76px; align-self: start;
  }
  @media (max-width: 720px) { .detail-media { position: static; } }
  .detail-media img { max-width: 100%; max-height: 420px; object-fit: contain;
                       border-radius: 10px; }
  .detail-media.cover { padding: 0; }
  .detail-media.cover img { width: 100%; height: 100%; max-height: none; object-fit: cover;
                            border-radius: 0; min-height: 300px; }
  .detail-media .noimg { font-size: 56px; color: var(--accent-dim); }

  .detail-body { padding: 30px 32px 32px; }
  .detail-body h1 { margin: 6px 0 4px; font-size: 27px; text-align: left; }
  .detail-body h3 { margin: 22px 0 8px; font-size: 12px; text-transform: uppercase;
              letter-spacing: 1px; color: var(--muted); }
  .detail-body p.lead { margin: 0; font-size: 14.5px; color: #cbd0dc; }
  .detail-body ul.ing-list { list-style: none; margin: 0; padding: 0; display: flex;
                             flex-direction: column; gap: 6px; }
  .detail-body ul.ing-list li { font-size: 14.5px; }
  .ing-list a.ing-link {
    color: var(--accent-2); border-bottom: 1px dotted var(--accent-dim); cursor: pointer;
  }
  .ing-list a.ing-link:hover { color: var(--accent); }
  .detail-body p.method { margin: 0; font-size: 14.5px; color: #c7ccd8; }
  .credit { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
            font-size: 11.5px; color: var(--muted); }
  .credit a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .credit a:hover { color: var(--text); }

  .also-note { font-size: 12px; color: var(--muted-2); margin: 4px 0 12px; }

  .skeleton { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<div class="backdrop">
  <div class="glow amber"></div>
  <div class="glow violet"></div>
  <div class="glow teal"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/"><span class="glass">📸</span> 찰칵 <b>Chalcock</b></a>
  </div>
</div>

<div class="wrap">

<!-- ============================= HOME / UPLOAD ============================= -->
<section id="view-home">
  <header class="hero">
    <svg class="hero-glass" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 12h70l-30 38v30h14v8H31v-8h14V50L15 12z" stroke="#f0a04b" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
    <div class="hero-mark">📸🍸</div>
    <h1>찰칵 찍으면, <b>칵테일</b>이 보여요</h1>
    <p class="sub">술장 사진 한 장이면 어떤 술이 있는지, 그걸로 뭘 만들 수 있는지 바로 알려드려요.</p>
  </header>

  <div class="upload-panel">
    <div class="panel">
      <div id="drop">
        <div class="icon">📷</div>
        <strong>사진을 끌어다 놓거나 클릭</strong>
        <p>술장·바 선반 사진 (JPG / PNG)</p>
      </div>
      <input type="file" id="file" accept="image/*" hidden>

      <div class="samples-label">또는 테스트 사진으로 바로 시험해보기</div>
      <div class="samples" id="samples"></div>

      <div class="spin" id="spin"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 찰칵! 분석 중…</div>
    </div>
  </div>
</section>

<!-- ============================= RESULTS ============================= -->
<section id="view-results" class="view" style="display:none">
  <a class="back" href="#/">‹ 새 사진 올리기</a>
  <div id="results-content"></div>
</section>

<!-- ============================= BOTTLE DETAIL ============================= -->
<section id="view-bottle" class="view" style="display:none">
  <a class="back" href="#/">‹ 처음으로</a>
  <div id="bottle-content"><div class="skeleton">불러오는 중…</div></div>
</section>

<!-- ============================= COCKTAIL DETAIL ============================= -->
<section id="view-cocktail" class="view" style="display:none">
  <a class="back" href="#/">‹ 처음으로</a>
  <div id="cocktail-content"><div class="skeleton">불러오는 중…</div></div>
</section>

</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, ch =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/* ---------------------------------------------------------------- upload ---- */
const drop = $('#drop'), fileInput = $('#file');

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) send(fileInput.files[0]); });

fetch('/api/samples').then(r => r.json()).then(list => {
  const box = $('#samples');
  list.forEach(name => {
    const img = document.createElement('img');
    img.src = '/samples/' + name;
    img.title = '이 사진으로 시험';
    img.onclick = async () => {
      const blob = await (await fetch('/samples/' + name)).blob();
      send(new File([blob], name, { type: blob.type }));
    };
    box.appendChild(img);
  });
});

let lastResult = null;

async function send(file) {
  $('#spin').classList.add('on');
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch('/api/detect', { method: 'POST', body: fd });
    const d = await res.json();
    if (d.error) { alert(d.error); return; }
    lastResult = d;
    location.hash = '#/results';
  } finally {
    $('#spin').classList.remove('on');
  }
}

/* ---------------------------------------------------------------- shared cards ---- */
function bottleRow(b) {
  const thumb = b.crop || b.photo
    ? `<img class="thumb" src="${b.crop || b.photo}" alt="" loading="lazy">`
    : `<div class="thumb ph">🍾</div>`;
  return `<a class="row-card" href="#/bottle/${encodeURIComponent(b.cls)}">
    ${thumb}
    <div class="body">
      <div class="nm">${esc(b.label)}</div>
      <div class="ing">${esc(b.ingredient)}</div>
    </div>
    <div class="conf">${b.conf.toFixed(2)}</div>
    <div class="go">›</div>
  </a>`;
}

function cocktailRow(c, missing) {
  const thumb = c.photo
    ? `<img class="thumb" src="${c.photo.src}" alt="" loading="lazy">`
    : `<div class="thumb ph">🍸</div>`;
  const note = missing
    ? `<div class="miss">필요: ${esc(c.missing.join(', '))}</div>`
    : (c.subs && c.subs.length
        ? `<div class="sub-note">대체: ${esc(c.subs.join(', '))}</div>` : '');
  const summary = note || `<div class="ing">${esc(c.ingredients.slice(0, 3).join(' · '))}</div>`;
  return `<a class="row-card" href="#/cocktail/${encodeURIComponent(c.slug)}">
    ${thumb}
    <div class="body">
      <div class="cat">${esc(c.category)}</div>
      <div class="nm">${esc(c.name)}</div>
      ${summary}
    </div>
    <div class="go">›</div>
  </a>`;
}

/* ---------------------------------------------------------------- results page ---- */
function showResults() {
  const box = $('#results-content');
  const d = lastResult;
  if (!d) {
    box.innerHTML = `<p class="empty">아직 분석한 사진이 없습니다. <a href="#/" style="color:var(--accent)">사진을 올려보세요</a>.</p>`;
    return;
  }
  box.innerHTML = `
    <div class="grid">
      <div>
        <div class="panel">
          <h2>검출 결과</h2>
          <img id="shot" alt="검출 결과" src="${d.image}">
          <div class="stats">
            <div class="stat"><b>${d.bottles_found}</b><span>병 검출</span></div>
            <div class="stat"><b>${d.named}</b><span>브랜드 식별</span></div>
            <div class="stat"><b>${d.ingredients.length}</b><span>재료</span></div>
          </div>
        </div>
        ${d.bottles.length ? `
        <div class="panel">
          <h2>식별된 병</h2>
          <div class="rows">${d.bottles.map(bottleRow).join('')}</div>
        </div>` : ''}
      </div>

      <div>
        <div class="panel">
          <h2>지금 만들 수 있는 칵테일</h2>
          <div class="rows">${d.makeable.length
            ? d.makeable.map(c => cocktailRow(c, false)).join('')
            : `<p class="empty">${d.bottles.length
                ? '식별된 재료로 정확히 만들 수 있는 IBA 칵테일이 없습니다. 아래 "한두 병만 더" 목록을 보세요.'
                : '병을 식별하지 못했습니다. 더 밝고 선명한 사진으로 다시 시도해보세요.'}</p>`}
          </div>
        </div>
        ${d.nearly.length ? `
        <div class="panel">
          <h2>한두 병만 더 있으면</h2>
          <div class="rows">${d.nearly.map(c => cocktailRow(c, true)).join('')}</div>
        </div>` : ''}
      </div>
    </div>`;
}

/* ---------------------------------------------------------------- router ---- */
function setView(id) {
  ['view-home', 'view-results', 'view-bottle', 'view-cocktail'].forEach(v =>
    $('#' + v).style.display = v === id ? '' : 'none');
  window.scrollTo(0, 0);
}

async function route() {
  const hash = location.hash.replace(/^#/, '') || '/';
  const bottleMatch = hash.match(/^\/bottle\/(.+)$/);
  const cocktailMatch = hash.match(/^\/cocktail\/(.+)$/);
  if (hash === '/results') {
    setView('view-results');
    showResults();
  } else if (bottleMatch) {
    setView('view-bottle');
    await showBottle(decodeURIComponent(bottleMatch[1]));
  } else if (cocktailMatch) {
    setView('view-cocktail');
    await showCocktail(decodeURIComponent(cocktailMatch[1]));
  } else {
    setView('view-home');
  }
}
window.addEventListener('hashchange', route);

/* ---------------------------------------------------------------- bottle page ---- */
async function showBottle(cls) {
  const box = $('#bottle-content');
  box.innerHTML = '<div class="skeleton">불러오는 중…</div>';
  const res = await fetch('/api/bottle/' + encodeURIComponent(cls));
  const b = await res.json();
  if (b.error) { box.innerHTML = `<p class="empty">${esc(b.error)}</p>`; return; }

  const media = b.photo
    ? `<img src="${b.photo}" alt="${esc(b.label)}">`
    : `<div class="noimg">🍾</div>`;
  const credit = b.credit
    ? `<div class="credit">사진: ${esc(b.credit.creator)} ·
        <a href="${b.credit.landing_url}" target="_blank" rel="noopener">Wikimedia Commons</a> ·
        <a href="${b.credit.license_url}" target="_blank" rel="noopener">${esc(b.credit.license)}</a></div>`
    : '';

  const list = items => items.map(c => `
    <a class="row-card" href="#/cocktail/${encodeURIComponent(c.slug)}">
      ${c.photo ? `<img class="thumb" src="${c.photo.src}" alt="" loading="lazy">`
                : `<div class="thumb ph">🍸</div>`}
      <div class="body">
        <div class="cat">${esc(c.category)}</div>
        <div class="nm">${esc(c.name)}</div>
      </div>
      <div class="go">›</div>
    </a>`).join('');

  box.innerHTML = `
    <div class="detail-sheet">
      <div class="detail-media">${media}</div>
      <div class="detail-body">
        <div class="cat">${esc(b.category)}</div>
        <h1>${esc(b.label)}</h1>
        <p class="lead">${esc(b.blurb)}</p>
        ${credit}

        <h3>이 술로 만들 수 있는 칵테일 ${b.cocktails.length ? `(${b.cocktails.length})` : ''}</h3>
        ${b.cocktails.length
          ? `<div class="rows">${list(b.cocktails)}</div>`
          : `<p class="empty">등록된 IBA 레시피 중 이 재료를 직접 필요로 하는 칵테일이 없습니다.</p>`}

        ${b.cocktails_sub.length ? `
          <h3 style="margin-top:26px">대체 재료로 가능</h3>
          <div class="also-note">아래 칵테일은 원래 다른 재료를 쓰지만 ${esc(b.label)}(으)로도 대신할 수 있습니다.</div>
          <div class="rows">${list(b.cocktails_sub)}</div>` : ''}
      </div>
    </div>`;
}

/* ---------------------------------------------------------------- cocktail page ---- */
async function showCocktail(slug) {
  const box = $('#cocktail-content');
  box.innerHTML = '<div class="skeleton">불러오는 중…</div>';
  const res = await fetch('/api/cocktail/' + encodeURIComponent(slug));
  const c = await res.json();
  if (c.error) { box.innerHTML = `<p class="empty">${esc(c.error)}</p>`; return; }

  const media = c.photo
    ? `<img src="${c.photo.src}" alt="${esc(c.name)}">`
    : `<div class="noimg">🍸</div>`;

  const ingLines = c.ingredients.map(i => i.key
    ? `<li><a class="ing-link" href="#/bottle/${encodeURIComponent(i.key)}">${esc(i.text)}</a></li>`
    : `<li>${esc(i.text)}</li>`).join('');

  const credit = c.photo
    ? `사진: ${esc(c.photo.creator)} ·
        <a href="${c.photo.landing_url}" target="_blank" rel="noopener">Wikimedia Commons</a> ·
        <a href="${c.photo.license_url}" target="_blank" rel="noopener">${esc(c.photo.license)}</a>
        <br>레시피: <a href="${c.url}" target="_blank" rel="noopener">IBA 공식</a>`
    : `레시피: <a href="${c.url}" target="_blank" rel="noopener">IBA 공식</a>`;

  box.innerHTML = `
    <div class="detail-sheet">
      <div class="detail-media cover">${media}</div>
      <div class="detail-body">
        <div class="cat">${esc(c.category)}</div>
        <h1>${esc(c.name)}</h1>

        <h3>재료</h3>
        <ul class="ing-list">${ingLines}</ul>

        <h3>만드는 방법</h3>
        <p class="method">${esc(c.method || '—')}</p>

        ${c.garnish && c.garnish.toUpperCase() !== 'N/A'
          ? `<h3>가니시</h3><p class="method">${esc(c.garnish)}</p>` : ''}

        <div class="credit">${credit}</div>
      </div>
    </div>`;
}

route();
</script>
</body>
</html>
