# The 50 detector classes, mapped to what they actually pour.
#
# `class` is the label the model predicts (the source folder name in finalloopy/).
# `ingredient` is the canonical key used by data/ingredient_rules.yaml, so a detected
# Gordon's on the shelf satisfies any recipe calling for gin.

