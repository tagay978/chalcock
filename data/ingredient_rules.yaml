# Freely interchangeable: holding the right-hand bottle genuinely satisfies the recipe.
equivalents:
  triple_sec:     [cointreau, curacao, grand_marnier]
  cointreau:      [triple_sec, curacao]
  curacao:        [triple_sec, cointreau, grand_marnier]
  brandy:         [cognac]
  cognac:         [brandy]
  bourbon_or_rye: [bourbon, rye]
  scotch:         [islay_scotch]
  whiskey:        [bourbon, rye, irish_whiskey, scotch]
  rum:            [white_rum, aged_rum, dark_rum, gold_rum, jamaican_rum, demerara_rum, spiced_rum]
  coffee_liqueur: [kahlua]

# Accepted only with --loose: drinkable, but not what the IBA specifies.
substitutes:
  white_rum:      [aged_rum, gold_rum, spiced_rum, dark_rum]
  aged_rum:       [dark_rum, gold_rum, jamaican_rum]
  dark_rum:       [aged_rum, jamaican_rum, demerara_rum]
  gold_rum:       [aged_rum, spiced_rum, dark_rum]
  jamaican_rum:   [dark_rum, aged_rum]
  demerara_rum:   [dark_rum, aged_rum]
  blackstrap_rum: [dark_rum]
  goslings_rum:   [dark_rum, aged_rum]
  overproof_rum:  [white_rum, aged_rum]
  rhum_agricole:  [aged_rum, white_rum]
  old_tom_gin:    [gin]
  rye:            [bourbon]
  bourbon:        [rye]
  vanilla_vodka:  [vodka]
  citron_vodka:   [vodka]
  angostura_bitters: [peychauds_bitters, orange_bitters]
  aged_rum_any:   [aged_rum]
  cherry_brandy:  [maraschino]
  sparkling_wine: [prosecco, champagne]
  champagne:      [prosecco, sparkling_wine]
  prosecco:       [champagne, sparkling_wine]
